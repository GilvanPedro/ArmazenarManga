# fly.toml app configuration file generated for armazenarmanga on 2026-10-02T12:29:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'armazenarmanga'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'mangas_dados'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
