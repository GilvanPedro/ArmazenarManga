  <path d="M9.5 22 Q20.5 23 32 30 L32 52 Q20.5 45 9.5 44 Z" fill="#fffaf6" stroke="#1e2a52" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M54.5 22 Q43.5 23 32 30 L32 52 Q43.5 45 54.5 44 Z" fill="#fffaf6" stroke="#1e2a52" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 29 Q21 29.8 27.5 33.5 M14 34 Q21 34.8 27.5 38.5 M14 39 Q19 39.6 23.5 42" stroke="#1e2a52" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".55"/>
  <path d="M32 30 Q38 27 45 26 L45 46 Q38 48 32 52 Z" fill="#1e2a52" opacity=".14"/>
