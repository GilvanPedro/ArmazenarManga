  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f4f"/><stop offset=".55" stop-color="#f2613f"/><stop offset="1" stop-color="#d93a26"/></linearGradient>
    <linearGradient id="pagina" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#ffd9c6"/><stop offset=".6" stop-color="#fff3ec"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
