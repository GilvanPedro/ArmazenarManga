<!-- Logo do Viracap (docs 142 e 143): o livro aberto forma o V e a pagina virando e o proximo capitulo; laranja com o azul-marinho do nanquim, reticula de manga no canto e linhas de movimento -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9154"/><stop offset=".55" stop-color="#f2613f"/><stop offset="1" stop-color="#dc3f28"/></linearGradient>
    <linearGradient id="pagina" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#ffe6d9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="tom" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="pontos" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#fff"/></pattern>
    <mask id="canto"><rect width="64" height="64" fill="url(#tom)"/></mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fundo)"/>
  <rect width="64" height="64" rx="15" fill="url(#pontos)" mask="url(#canto)"/>
