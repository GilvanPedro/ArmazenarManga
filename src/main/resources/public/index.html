<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <!-- e por esta marca que a extensao de navegador (pasta extensao/) reconhece o site -->
    <meta name="meus-mangas-site" content="1">
    <title>Viracap · sua lista de mangás, manhwas e manhuas</title>
    <!-- o que aparece na busca do Google e quando alguem compartilha o link -->
    <meta name="description" content="Organize os mangás, manhwas e manhuas que você lê: continue do capítulo onde parou, veja o que lança hoje, descubra obras novas e compartilhe listas com a comunidade.">
    <link rel="canonical" href="https://viracap.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Viracap">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://viracap.vercel.app/">
    <meta property="og:title" content="Viracap">
    <meta property="og:description" content="Organize os mangás que você lê, continue de onde parou, veja os lançamentos do dia e descubra obras novas.">
    <meta property="og:image" content="https://viracap.vercel.app/compartilhar.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo do Viracap com o texto: sua lista de mangás">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#f2613f">
    <!-- para o Google: o nome do site (para mostrar "Viracap" no resultado, e nao o endereco) e o que ele e, com as
         capturas da tela. So dados: o navegador nao executa -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebSite",
                "name": "Viracap",
                "alternateName": ["Viracap mangás", "viracap.vercel.app"],
                "url": "https://viracap.vercel.app/",
                "inLanguage": "pt-BR",
                "description": "Organize os mangás, manhwas e manhuas que você lê: continue do capítulo onde parou, veja o que lança hoje, descubra obras novas e compartilhe listas com a comunidade."
            },
            {
                "@type": "WebApplication",
                "name": "Viracap",
                "url": "https://viracap.vercel.app/",
                "applicationCategory": "LifestyleApplication",
                "operatingSystem": "Web",
                "inLanguage": "pt-BR",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
                "description": "Lista de mangás, manhwas e manhuas: guarda o capítulo em que você parou, mostra os lançamentos do dia, recomenda obras novas e tem uma comunidade de leitores.",
                "screenshot": [
                    { "@type": "ImageObject", "url": "https://viracap.vercel.app/capturas/biblioteca.webp", "caption": "Biblioteca do Viracap: a lista de mangás com capa, status, nota e próximo capítulo" },
                    { "@type": "ImageObject", "url": "https://viracap.vercel.app/capturas/comunidade.webp", "caption": "Comunidade do Viracap: posts, listas compartilhadas e #tags" },
                    { "@type": "ImageObject", "url": "https://viracap.vercel.app/capturas/manga.webp", "caption": "Página de um mangá no Viracap: capítulo atual, lançamento, nota, tags e sinopse" }
                ]
            }
        ]
    }
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icone-180.png">
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topo">
    <a class="marca" href="#/">
        <img src="favicon.svg" alt="" width="28" height="28">
        <span>Viracap</span>
    </a>
    <!-- as duas partes do site: a biblioteca de cada um (a lista, os lancamentos, descobrir) e a comunidade -->
    <nav class="secoes" aria-label="Partes do site" hidden>
        <a class="secao" id="secao-biblioteca" href="#/"><svg class="icone-da-secao" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H8v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4h4v16H8z"/><path d="m14.6 5.4 3.3-.9 3.1 14.6-3.3.9z"/></svg><span>Biblioteca</span></a>
        <a class="secao" id="secao-comunidade" href="#/comunidade"><svg class="icone-da-secao" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.4-4.4A7.5 7.5 0 1 1 20 11.5z"/></svg><span>Comunidade</span></a>
        <!-- so na versao do Vercel: bordas e efeitos para os favoritos -->
        <a class="secao" id="secao-loja" href="#/loja" hidden><svg class="icone-da-secao" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>Loja</span></a>
        <!-- so para administradores: suspender, banir e o registro da moderacao -->
        <a class="secao" id="secao-gerenciar" href="#/gerenciar" hidden><svg class="icone-da-secao" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.4 3.2 8.3 7.5 9.5 4.3-1.2 7.5-5.1 7.5-9.5V6z"/></svg><span>Gerenciar</span></a>
    </nav>
    <div class="acoes-do-topo">
        <a class="botao primario" id="adicionar" href="#/novo">+ Adicionar</a>
        <!-- aparecem depois de entrar na conta -->
        <a id="minha-conta" class="botao minha-conta" href="#/conta" hidden></a>
        <button type="button" id="sair" class="botao" hidden>Sair</button>
        <!-- quem nao tem conta (doc 104) -->
        <a id="entrar" class="botao" href="#/entrar" hidden>Entrar</a>
        <a id="criar-conta" class="botao primario" href="#/criar-conta" hidden>Criar conta</a>
    </div>
</header>
<main id="app"></main>
<div id="avisos" class="avisos" aria-live="polite"></div>
<noscript><p class="vazio">Este site precisa de JavaScript para funcionar.</p></noscript>
<script src="app.js"></script>
</body>
</html>
